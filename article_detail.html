<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>思辨之境</title>
<script>document.documentElement.classList.add('js');try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);var s=localStorage.getItem('reader-size');if(s)document.documentElement.style.setProperty('--reader-size',s+'px')}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23b23a2a'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='white' font-family='serif' font-weight='700'%3E思%3C/text%3E%3C/svg%3E">
</head>
<body>
<div class="progress" id="progress"></div>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html"><span class="seal">思</span>思辨之境</a>
    <nav class="nav" aria-label="主导航">
      <a href="index.html#featured" class="hide-sm">精选</a>
      <a href="index.html#series" class="hide-sm">系列</a>
      <a href="index.html#archive">文库</a>
      <a href="index.html#about">关于</a>
      <button class="icon-btn" type="button" data-theme-toggle aria-label="切换深浅色">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
      </button>
    </nav>
  </div>
</header>

<div class="article-layout">
  <aside class="toc" aria-label="目录">
    <a class="back" href="index.html#archive">← 返回文库</a>
    <div id="toc-box"></div>
  </aside>

  <article class="reader">
    <div id="head" class="reader-head"></div>
    <div class="prose" id="body"><p class="loading">正在载入文章…</p></div>
    <div id="end"></div>
  </article>
</div>

<footer class="site-footer" data-colophon></footer>

<script src="assets/vendor/marked.min.js"></script>
<script src="assets/site.js"></script>
<script>
(function () {
  var L = Lib, esc = L.esc;
  var file = new URLSearchParams(location.search).get('file') || 'LLMs_cant_jump.md';
  var path = 'articles/' + encodeURIComponent(file);

  Promise.all([
    L.load().catch(function () { return []; }),
    fetch(path).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
  ]).then(function (res) {
    var list = res[0];
    var meta = list.filter(function (a) { return a.filename === file; })[0] || { filename: file, title: file.replace(/\.md$/, ''), category: '', tags: [] };
    show(meta, list, res[1]);
  }).catch(function (e) {
    document.getElementById('body').innerHTML = '<div class="load-error"><p>没有找到这篇文章（' + esc(e.message) + '）。</p><p><a href="index.html#archive">← 返回文库</a></p></div>';
  });

  // ---------- Markdown preprocessing ----------
  function split(md) {
    md = md.replace(/\r\n/g, '\n');
    if (md.indexOf('---\n') === 0) {                         // YAML front matter
      var end = md.indexOf('\n---', 4);
      if (end > 0) md = md.slice(end + 4);
    }
    md = md.replace(/^\s*# .*\n/, '');                         // title (shown in header)
    md = md.replace(/^\s*——.*\n/, '');                         // subtitle line (shown in header)
    var header = '';
    var m = md.match(/^([\s\S]*?)\n-{3,}\s*\n/);               // author/source block before first rule
    if (m && m[1].length < 1500 && /UP\s*主|原作者/.test(m[1])) {
      header = m[1].trim();
      md = md.slice(m[0].length);
    }
    return { header: header, body: md };
  }

  function protectMath(md) {
    var store = [];
    md = md.replace(/\$\$([\s\S]+?)\$\$/g, function (_, tex) { store.push({ tex: tex, display: true }); return '@@MATH' + (store.length - 1) + '@@'; });
    md = md.replace(/\$([^$\n]+?)\$/g, function (_, tex) { store.push({ tex: tex, display: false }); return '@@MATH' + (store.length - 1) + '@@'; });
    // CommonMark won't close **bold** next to CJK punctuation (e.g. **溯因（A）**的), so convert those directly.
    md = md.replace(/\*\*(?=\S)([^*\n]+?\S)\*\*/g, '<strong>$1</strong>');
    return { md: md, store: store };
  }

  function slug(text, used) {
    var s = text.toLowerCase().replace(/<[^>]+>/g, '').replace(/&[a-z#0-9]+;/g, '')
      .replace(/[^\p{L}\p{N}\s_-]/gu, '').trim().replace(/\s/g, '-') || 'section';
    var base = s, i = 1;
    while (used[s]) s = base + '-' + (i++);
    used[s] = true;
    return s;
  }

  function render(md) {
    var used = {}, heads = [];
    var renderer = new marked.Renderer();
    renderer.heading = function (text, level, raw) {
      var id = slug(raw, used);
      if ((level === 2 || level === 3) && !/^目录$/.test(raw.trim())) heads.push({ id: id, level: level, text: raw.replace(/[*_`]/g, '') });
      return '<h' + level + ' id="' + id + '">' + text + '</h' + level + '>';
    };
    renderer.image = function (href, title, text) {
      if (href && !/^(https?:)?\/\//.test(href) && href.charAt(0) !== '/') href = 'articles/' + href;
      return '<img src="' + esc(href) + '" alt="' + esc(text) + '" loading="lazy">';
    };
    renderer.table = function (header, body) {
      return '<div class="table-wrap"><table><thead>' + header + '</thead><tbody>' + body + '</tbody></table></div>';
    };
    renderer.link = function (href, title, text) {
      var ext = /^https?:/.test(href || '');
      return '<a href="' + esc(href) + '"' + (ext ? ' target="_blank" rel="noopener"' : '') + '>' + text + '</a>';
    };
    var html = marked.parse(md, { renderer: renderer, gfm: true, breaks: false });
    return { html: html, heads: heads };
  }

  function loadKatex() {
    return new Promise(function (ok, fail) {
      var css = document.createElement('link');
      css.rel = 'stylesheet'; css.href = 'assets/vendor/katex/katex.min.css';
      document.head.appendChild(css);
      var s = document.createElement('script');
      s.src = 'assets/vendor/katex/katex.min.js'; s.onload = ok; s.onerror = fail;
      document.head.appendChild(s);
    });
  }

  // ---------- Page ----------
  function show(a, list, md) {
    var cat = L.catName(a.category);
    document.title = a.title + ' · 思辨之境';
    var parts = split(md);
    var pm = protectMath(parts.body);
    var out = render(pm.md);

    var links = [];
    if (a.source) links.push('<a href="' + esc(a.source) + '" target="_blank" rel="noopener">' + (a.kind === '视频文案' ? '原视频' : '原文') + '</a>');
    if (a.pdf) links.push('<a href="articles/' + encodeURIComponent(a.pdf) + '" target="_blank" rel="noopener">PDF</a>');
    links.push('<a href="' + path + '" target="_blank" rel="noopener">Markdown</a>');

    var src = L.source(a);
    var headerHtml = parts.header ? marked.parse(parts.header.replace(/^>\s?/gm, '').replace(/^-\s+/gm, ''), { breaks: true }) : '';

    var seriesHtml = '';
    if (a.part) {
      var sib = list.filter(function (x) { return x.series === a.series; }).sort(function (x, y) { return x.part - y.part; });
      seriesHtml = '<nav class="series-box" aria-label="系列"><span class="eyebrow">系列 · ' + esc(a.series) + '</span><ol>' +
        sib.map(function (x) {
          return '<li' + (x.filename === a.filename ? ' class="cur"' : '') + '><a href="' + L.url(x) + '"><span class="n">0' + x.part + '</span><span>' + esc(L.partLabel(x)) + '</span></a></li>';
        }).join('') + '</ol></nav>';
    }

    document.getElementById('head').innerHTML =
      '<span class="glyph lg solid" aria-hidden="true">' + esc(L.glyph(a.category)) + '</span>' +
      '<div class="crumb"><a href="index.html#archive">文库</a><span>/</span><span class="tag">' + esc(cat || '文章') + '</span>' +
        (src ? '<span>/</span><span>' + esc(src) + '</span>' : '') + '</div>' +
      '<h1 class="title">' + esc(a.title) + '</h1>' +
      (a.subtitle ? '<p class="subtitle">' + esc(a.subtitle) + '</p>' : '') +
      '<div class="article-meta">' +
        (a.char_count ? '<span>约 ' + L.wan(a.char_count) + '</span>' : '') +
        (a.read_time ? '<span>' + esc(a.read_time) + '</span>' : '') +
        (a.duration ? '<span>视频 ' + esc(a.duration) + '</span>' : '') +
        '<span>' + links.join(' · ') + '</span>' +
        '<span class="spacer"></span>' +
        '<div class="reader-tools" role="group" aria-label="字号"><button type="button" data-size="-1" aria-label="缩小字号">A−</button><button type="button" data-size="1" aria-label="放大字号">A+</button></div>' +
      '</div>' +
      (headerHtml ? '<div class="source-card">' + headerHtml + '</div>' : '') +
      seriesHtml;

    var body = document.getElementById('body');
    body.innerHTML = out.html;

    // Lone images become figures with captions.
    body.querySelectorAll('p > img:only-child').forEach(function (img) {
      var p = img.parentNode;
      if (p.textContent.trim()) return;
      var fig = document.createElement('figure');
      fig.appendChild(img);
      if (img.alt) { var cap = document.createElement('figcaption'); cap.textContent = img.alt; fig.appendChild(cap); }
      p.replaceWith(fig);
    });

    if (pm.store.length) {
      loadKatex().then(function () {
        body.innerHTML = body.innerHTML.replace(/@@MATH(\d+)@@/g, function (_, i) {
          var m = pm.store[+i];
          try { return katex.renderToString(m.tex, { displayMode: m.display, throwOnError: false }); }
          catch (e) { return esc(m.tex); }
        });
        setupScroll(out.heads);
      }).catch(function () {
        body.innerHTML = body.innerHTML.replace(/@@MATH(\d+)@@/g, function (_, i) { return '<code>' + esc(pm.store[+i].tex) + '</code>'; });
      });
    }

    buildToc(out.heads);
    buildEnd(a, list, links);
    setupScroll(out.heads);
    if (location.hash) { var t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) t.scrollIntoView(); }
  }

  function buildToc(heads) {
    var h2 = heads.filter(function (h) { return h.level === 2; });
    var use = h2.length >= 3 ? (heads.length <= 28 ? heads : h2) : heads;
    if (use.length < 2) return;
    document.getElementById('toc-box').innerHTML = '<div class="eyebrow">目录<span class="pct" id="pct">0%</span></div><div class="toc-progress"><i id="tocbar"></i></div><ol id="toc">' +
      use.map(function (h) {
        return '<li' + (h.level === 3 && use !== h2 && h2.length ? ' class="sub"' : '') + '><a href="#' + h.id + '">' + esc(h.text) + '</a></li>';
      }).join('') + '</ol>';
  }

  function buildEnd(a, list, links) {
    var prev, next, pool;
    if (a.part) {
      pool = list.filter(function (x) { return x.series === a.series; }).sort(function (x, y) { return x.part - y.part; });
    } else {
      pool = list.filter(function (x) { return x.category === a.category; });
    }
    var i = pool.map(function (x) { return x.filename; }).indexOf(a.filename);
    if (i >= 0) { prev = pool[i - 1]; next = pool[i + 1]; }
    var label = a.part ? '系列' : L.catName(a.category);
    var related = list.filter(function (x) {
      return x.category === a.category && x.filename !== a.filename && (!a.series || x.series !== a.series) && x !== prev && x !== next;
    }).slice(0, 4);

    document.getElementById('end').innerHTML =
      '<div class="fin" aria-hidden="true"><span class="glyph">终</span></div>' +
      '<div class="article-end"><div class="actions"><span>本文文件：</span>' + links.join(' · ') + '</div>' +
      ((prev || next) ? '<nav class="pager" aria-label="上一篇与下一篇">' +
        (prev ? '<a class="prev" href="' + L.url(prev) + '"><small>← 上一篇 · ' + esc(label) + '</small><b>' + esc(prev.title) + '</b></a>' : '') +
        (next ? '<a class="next" href="' + L.url(next) + '"><small>下一篇 · ' + esc(label) + ' →</small><b>' + esc(next.title) + '</b></a>' : '') +
      '</nav>' : '') +
      (related.length ? '<div class="related"><span class="eyebrow">同领域 · ' + esc(L.catName(a.category)) + '</span><ul>' +
        related.map(function (x) { return '<li><a href="' + L.url(x) + '">' + esc(x.title) + '<span>' + esc(x.read_time) + '</span></a></li>'; }).join('') +
      '</ul></div>' : '') + '</div>';
  }

  var scrollBound = false, tocLinks = [], tocHeads = [];
  function setupScroll() {
    tocLinks = Array.prototype.slice.call(document.querySelectorAll('#toc a'));
    tocHeads = tocLinks.map(function (l) { return document.getElementById(l.getAttribute('href').slice(1)); });
    if (scrollBound) return onScroll();
    scrollBound = true;
    addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  }
  function onScroll() {
    var h = document.documentElement.scrollHeight - innerHeight;
    var pc = h > 0 ? Math.min(100, scrollY / h * 100) : 0;
    document.getElementById('progress').style.width = pc + '%';
    var pe = document.getElementById('pct'), tb = document.getElementById('tocbar');
    if (pe) pe.textContent = Math.round(pc) + '%';
    if (tb) tb.style.width = pc + '%';
    var idx = -1;
    tocHeads.forEach(function (el, i) { if (el && el.getBoundingClientRect().top < 140) idx = i; });
    tocLinks.forEach(function (l, i) { l.classList.toggle('active', i === idx); });
    var act = tocLinks[idx];
    if (act) {
      var box = document.querySelector('.toc');
      var r = act.getBoundingClientRect(), b = box.getBoundingClientRect();
      if (r.top < b.top + 40 || r.bottom > b.bottom - 20) box.scrollTop += r.top - b.top - b.height / 2;
    }
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-size]'); if (!b) return;
    var cur = parseFloat(getComputedStyle(document.querySelector('.reader')).fontSize) || 18;
    var next = Math.max(15, Math.min(22, cur + Number(b.dataset.size)));
    document.documentElement.style.setProperty('--reader-size', next + 'px');
    try { localStorage.setItem('reader-size', next); } catch (err) {}
  });
})();
</script>
</body>
</html>
